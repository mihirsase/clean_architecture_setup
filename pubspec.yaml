name: shop_me
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  injectable: ^2.5.0
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  auto_route: ^10.1.0+1
  dio: ^5.8.0+1
  equatable: ^2.0.7
  json_serializable: ^6.9.5

  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  injectable_generator: ^2.7.0
  auto_route_generator: ^10.1.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  
flutter:
  uses-material-design: true

  fonts:
    - family: LabGrotesque
      fonts:
        - asset: assets/fonts/lab-grotesque-regular-trial.otf
    - family: PPSupplySans
      fonts:
        - asset: assets/fonts/p-p-supply-sans-regular.otf
